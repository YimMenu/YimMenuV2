name: Windows CI Build

on:
  push:
    branches:
      - main
      - enhanced
      - develop
  pull_request:
    branches:
      - main
      - enhanced
      - develop
  workflow_dispatch:

jobs:
  windows-build:
    name: Windows Build (${{ matrix.config }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Release
            type: Release
          - name: RelWithDebInfo
            type: RelWithDebInfo
          - name: Debug
            type: Debug
    env:
      BUILD_DIR: ${{ github.workspace }}/build
      INSTALL_DIR: ${{ github.workspace }}/install
    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      
      # Display environment info
      - name: Display system info
        shell: powershell
        run: |
          Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
          Write-Host "OS: $(Get-CimInstance Win32_OperatingSystem | Select-Object Caption)"
          [System.Environment]::OSVersion | Write-Host
          Write-Host "Available Visual Studio installations:"
          if (Test-Path "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build") {
            Write-Host "  - Enterprise"
          }
          if (Test-Path "${env:ProgramFiles}\Microsoft Visual Studio\2022\Professional\VC\Auxiliary\Build") {
            Write-Host "  - Professional"
          }
          if (Test-Path "${env:ProgramFiles}\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build") {
            Write-Host "  - Community"
          }
      
      # Setup MSVC v143 toolset using vcvarsall.bat
      - name: Setup MSVC v143 Environment
        shell: powershell
        run: |
          Write-Host "=== Setting up MSVC v143 Environment ===" -ForegroundColor Green
          
          # Try different Visual Studio editions
          $vsEditions = @("Enterprise", "Professional", "Community")
          $vcvarsPath = $null
          
          foreach ($edition in $vsEditions) {
            $testPath = "${env:ProgramFiles}\Microsoft Visual Studio\2022\$edition\VC\Auxiliary\Build\vcvarsall.bat"
            if (Test-Path $testPath) {
              $vcvarsPath = $testPath
              Write-Host "Found vcvarsall.bat at: $vcvarsPath"
              break
            }
          }
          
          if (!$vcvarsPath) {
            Write-Host "ERROR: Could not find vcvarsall.bat in any VS2022 edition" -ForegroundColor Red
            Write-Host "Available directories:"
            Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\2022\" -Directory | ForEach-Object { Write-Host "  - $($_.Name)" }
            exit 1
          }
          
          # Call vcvarsall.bat to set up x64 environment
          Write-Host "Initializing MSVC environment for x64..."
          & $vcvarsPath x64 > $env:TEMP\vcvars_output.txt 2>&1
          
          # Check if the call was successful
          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: vcvarsall.bat failed with exit code $LASTEXITCODE" -ForegroundColor Red
            Write-Host "Output:"
            Get-Content $env:TEMP\vcvars_output.txt
            exit 1
          }
          
          Write-Host "MSVC environment initialized successfully" -ForegroundColor Green
          
          # Verify tools are available
          $clPath = (Get-Command cl.exe -ErrorAction SilentlyContinue).Source
          $linkPath = (Get-Command link.exe -ErrorAction SilentlyContinue).Source
          $libPath = (Get-Command lib.exe -ErrorAction SilentlyContinue).Source
          
          Write-Host "CL.exe: $clPath"
          Write-Host "Link.exe: $linkPath"
          Write-Host "Lib.exe: $libPath"
          
          if (!$clPath -or !$linkPath -or !$libPath) {
            Write-Host "ERROR: Not all required tools are available" -ForegroundColor Red
            exit 1
          }
          
          Write-Host "All MSVC tools verified successfully" -ForegroundColor Green
      
      # Verify MSVC installation
      - name: Verify MSVC installation
        continue-on-error: true
        shell: powershell
        run: |
          Write-Host "Checking MSVC toolset..."
          cl.exe
          link.exe
          lib.exe
      
      # Skip problematic caching that's causing 400 errors
      - name: Skip cache
        continue-on-error: true
        shell: powershell
        run: |
          Write-Host "Skipping cache to avoid GitHub infrastructure issues..."
          # Note: We skip cache for now to avoid 400 errors from GitHub infrastructure
      
      # Install build dependencies (if needed)
      - name: Install build dependencies
        shell: powershell
        run: |
          Write-Host "Build dependencies pre-installed on windows-2022"
          Write-Host "Available tools:"
          where cmake
          where ninja
          where git
          cmake --version
          if (where ninja) { ninja --version } else { Write-Host "Ninja not found - using default make" }
      
      # Generate CMake project
      - name: Generate CMake project (${{ matrix.config.type }})
        shell: powershell
        run: |
          Write-Host "=== CMake Configuration ===" -ForegroundColor Green
          
          # Check current directory and handle nested directory issue
          Write-Host "Current directory: $(Get-Location)"
          Write-Host "Repository root: ${{ github.workspace }}"
          
          # Determine the correct source directory
          $sourceDir = "${{ github.workspace }}"
          
          # Check if there's a nested directory structure (yimv2/yimv2)
          $potentialNestedSource = Join-Path "${{ github.workspace }}" "yimv2"
          if (Test-Path $potentialNestedSource) {
            Write-Host "WARNING: Detected nested directory structure" -ForegroundColor Yellow
            Write-Host "Checking if nested directory is the actual source..."
            
            # If the nested directory has CMakeLists.txt and current doesn't, use nested
            $nestedCMake = Join-Path $potentialNestedSource "CMakeLists.txt"
            $rootCMake = Join-Path "${{ github.workspace }}" "CMakeLists.txt"
            
            if (Test-Path $nestedCMake -and !(Test-Path $rootCMake)) {
              Write-Host "Using nested directory as source: $potentialNestedSource" -ForegroundColor Green
              $sourceDir = $potentialNestedSource
            } elseif (Test-Path $nestedCMake -and Test-Path $rootCMake) {
              Write-Host "Both locations have CMakeLists.txt - using root as source" -ForegroundColor Yellow
            }
          }
          
          # Change to source directory
          Set-Location $sourceDir
          Write-Host "Changed to source directory: $sourceDir"
          
          # Determine build type
          $buildType = "${{ matrix.config.type }}"
          Write-Host "Build type: $buildType"
          
          # Verify CMakeLists.txt exists in source directory
          if (!(Test-Path "CMakeLists.txt")) {
            Write-Host "ERROR: CMakeLists.txt not found in source directory: $sourceDir!" -ForegroundColor Red
            Write-Host "Source directory contents:"
            Get-ChildItem -Path $sourceDir -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  - $($_.Name)" }
            
            # Try to find CMakeLists.txt anywhere in workspace
            Write-Host "Searching for CMakeLists.txt in entire workspace..."
            $cmakeFiles = Get-ChildItem -Path "${{ github.workspace }}" -Recurse -Filter "CMakeLists.txt" -ErrorAction SilentlyContinue
            if ($cmakeFiles) {
              Write-Host "Found CMakeLists.txt at:"
              $cmakeFiles | ForEach-Object { Write-Host "  - $($_.FullName)" }
              $sourceDir = $cmakeFiles[0].Directory.FullName
              Write-Host "Using source directory: $sourceDir"
              Set-Location $sourceDir
            } else {
              Write-Host "No CMakeLists.txt found anywhere in workspace!" -ForegroundColor Red
              exit 1
            }
          }
          
          Write-Host "Found CMakeLists.txt at: $(Join-Path $sourceDir 'CMakeLists.txt')"
          
          # Clean previous build directories
          Write-Host "Cleaning previous build directories..."
          $possibleBuildDirs = @("${{ env.BUILD_DIR }}", "${{ github.workspace }}/build", "$sourceDir/build")
          foreach ($buildDir in $possibleBuildDirs) {
            if (Test-Path $buildDir) {
              Write-Host "Cleaning: $buildDir"
              Remove-Item -Recurse -Force $buildDir -ErrorAction SilentlyContinue
            }
          }
          
          # Configure with CMake using generator that works with MSVC
          Write-Host "Running CMake configuration for $buildType..."
          Write-Host "CMake version: $(cmake --version | Select-Object -First 1)"
          Write-Host "Source directory: $sourceDir"
          Write-Host "Build directory: ${{ env.BUILD_DIR }}"
          
          & cmake -G "Visual Studio 17 2022" `
                -A x64 `
                -DCMAKE_BUILD_TYPE=$buildType `
                -DCMAKE_CXX_STANDARD=23 `
                -DCMAKE_CXX_FLAGS="/MP" `
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
                -S $sourceDir `
                -B "${{ env.BUILD_DIR }}"
          
          if ($LASTEXITCODE -ne 0) {
            Write-Host "CMake configuration failed!" -ForegroundColor Red
            
            # Check for CMake error log
            $errorLog = "${{ env.BUILD_DIR }}/CMakeError.log"
            if (Test-Path $errorLog) {
              Write-Host "CMake Error Log contents:"
              Get-Content $errorLog | Select-Object -Last 20
            }
            
            # List source directory contents for debugging
            Write-Host "Source directory contents:"
            Get-ChildItem -Path $sourceDir -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  - $($_.Name)" }
            
            # List CMake build directory if it exists
            if (Test-Path "${{ env.BUILD_DIR }}") {
              Write-Host "Build directory contents:"
              Get-ChildItem -Path "${{ env.BUILD_DIR }}" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 10
            }
            
            exit 1
          }
          
          Write-Host "CMake configuration completed successfully" -ForegroundColor Green
          
          # Verify build directory was created
          if (!(Test-Path "${{ env.BUILD_DIR }}")) {
            Write-Host "ERROR: Build directory was not created!" -ForegroundColor Red
            exit 1
          }
          
          Write-Host "Build directory contents:"
          Get-ChildItem -Path "${{ env.BUILD_DIR }}" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  - $($_.Name)" }
      
      # Build project
      - name: Build (${{ matrix.config.type }})
        shell: powershell
        run: |
          Write-Host "=== Building ${{ matrix.config.type }} ===" -ForegroundColor Green
          
          # Build with CMake (preferred method)
          Write-Host "Building with CMake..."
          cmake --build "${{ env.BUILD_DIR }}" `
                --config ${{ matrix.config.type }} `
                --parallel `
                --verbose
          
          if ($LASTEXITCODE -ne 0) {
            Write-Host "CMake build failed, trying with MSBuild..." -ForegroundColor Yellow
            
            # Fallback to direct MSBuild
            & "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe" `
              "${{ env.BUILD_DIR }}\YimMenuV2.sln" `
              /m `
              /p:Configuration=${{ matrix.config.type }} `
              /p:Platform=x64 `
              /p:OutDir="${{ env.BUILD_DIR }}\${{ matrix.config.type }}\" `
              /v:minimal
          }
          
          # Verify build output
          Write-Host "Checking build output..."
          Get-ChildItem -Path "${{ env.BUILD_DIR }}" -Recurse -Include "*.dll", "*.lib", "*.pdb" | ForEach-Object {
            Write-Host "Built: $($_.Name) ($([math]::Round($_.Length/1KB, 2)) KB)"
          }
      
      # Create install directory
      - name: Create install directory
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "${{ env.INSTALL_DIR }}"
      
      # Install build artifacts
      - name: Install artifacts
        shell: powershell
        run: |
          cmake --install "${{ env.BUILD_DIR }}" `
            --config ${{ matrix.config.type }} `
            --prefix "${{ env.INSTALL_DIR }}"
      
      # Run unit tests if available
      - name: Run tests (if available)
        shell: powershell
        continue-on-error: true
        run: |
          if (Test-Path "${{ env.BUILD_DIR }}/${{ matrix.config.type }}/test_runner.exe") {
            & "${{ env.BUILD_DIR }}/${{ matrix.config.type }}/test_runner.exe"
          } else {
            Write-Host "No test runner found"
          }
      
      # Check build output
      - name: Verify build output
        shell: powershell
        run: |
          Write-Host "=== Verifying Build Output ===" -ForegroundColor Green
          
          # Find DLL files
          $dllFiles = Get-ChildItem -Path "${{ env.BUILD_DIR }}" -Recurse -Include "*.dll" -Filter "*YimMenuV2*"
          
          if ($dllFiles.Count -gt 0) {
            Write-Host "✓ DLL files found:" -ForegroundColor Green
            $dllFiles | ForEach-Object {
              $dllInfo = Get-Item $_
              Write-Host "  - $($_.FullName) ($([math]::Round($dllInfo.Length/1KB, 2)) KB)"
            }
          } else {
            Write-Host "✗ No YimMenuV2 DLL files found!" -ForegroundColor Red
            Write-Host "Searching for any DLL files in build directory:" -ForegroundColor Yellow
            Get-ChildItem -Path "${{ env.BUILD_DIR }}" -Recurse -Include "*.dll" | ForEach-Object {
              Write-Host "  - $($_.FullName)"
            }
            exit 1
          }
      
      # Generate artifact names
      - name: Generate artifact name
        shell: powershell
        id: artifact
        run: |
          $date = Get-Date -Format 'yyyy-MM-dd'
          $commit_short = "${{ github.sha }}".Substring(0, 7)
          $artifact_name = "${{ matrix.config.type }}-build-$date-$commit_short"
          Write-Host "artifact_name=$artifact_name" >> $env:GITHUB_OUTPUT
      
      # Upload build artifacts
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: |
            ${{ env.BUILD_DIR }}/**/*YimMenuV2*.dll
            ${{ env.BUILD_DIR }}/**/*YimMenuV2*.lib
            ${{ env.BUILD_DIR }}/**/*YimMenuV2*.pdb
            ${{ env.INSTALL_DIR }}/**
          retention-days: 30
          compression-level: 6
      
      # Upload build logs on failure
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.config.type }}
          path: |
            ${{ env.BUILD_DIR }}/**/CMakeFiles/
            ${{ env.BUILD_DIR }}/**/CMakeOutput.log
            ${{ env.BUILD_DIR }}/**/CMakeError.log
          retention-days: 10
      
      # Generate build summary
      - name: Generate build summary
        if: always()
        shell: powershell
        run: |
          Write-Host "## Windows Build Summary" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "**Configuration:** ${{ matrix.config.type }}" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "**Runner:** ${{ matrix.os }}" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "**Commit:** ${{ github.sha }}" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "**Build Directory:** ${{ env.BUILD_DIR }}" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "" >> $env:GITHUB_STEP_SUMMARY
          
          $dlls = Get-ChildItem -Path "${{ env.BUILD_DIR }}" -Recurse -Include "*.dll" -ErrorAction SilentlyContinue
          if ($dlls) {
            Write-Host "**Generated DLLs:**" >> $env:GITHUB_STEP_SUMMARY
            $dlls | ForEach-Object {
              Write-Host "- $($_.Name)" >> $env:GITHUB_STEP_SUMMARY
            }
          }

  build-status:
    name: Build Status Check
    runs-on: ubuntu-latest
    needs: [windows-build]
    if: always()
    
    steps:
      - name: Check build results
        run: |
          if [ "${{ needs.windows-build.result }}" = "success" ]; then
            echo "✓ All Windows builds completed successfully"
            exit 0
          else
            echo "✗ One or more builds failed"
            exit 1
          fi
