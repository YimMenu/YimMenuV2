name: Windows CI Build

on:
  push:
    branches:
      - main
      - enhanced
      - develop
  pull_request:
    branches:
      - main
      - enhanced
      - develop
  workflow_dispatch:

jobs:
  windows-build:
    name: Windows Build (${{ matrix.config }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Release
            type: Release
          - name: RelWithDebInfo
            type: RelWithDebInfo
          - name: Debug
            type: Debug
    env:
      BUILD_DIR: ./build
      INSTALL_DIR: ./install    
    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          path: .
      
      # Display environment info
      - name: Display system info
        shell: powershell
        run: |
          Write-Host "=== System Information ===" -ForegroundColor Green
          Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
          Write-Host "OS: $(Get-CimInstance Win32_OperatingSystem | Select-Object Caption)"
          Write-Host "CMake version: $(cmake --version | Select-Object -First 1)"
          Write-Host "Git version: $(git --version)"
          [System.Environment]::OSVersion | Write-Host

      # Verify Visual Studio installation
      - name: Verify Visual Studio installation
        shell: powershell
        run: |
          Write-Host "=== Visual Studio Verification ===" -ForegroundColor Green

          $vsWherePath = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vsWherePath) {
            Write-Host "Visual Studio installations:"
            & $vsWherePath -all -property displayName,installationPath,installationVersion
          } else {
            Write-Host "ERROR: vswhere.exe not found!" -ForegroundColor Red
            exit 1
          }

          # Verify MSVC is available
          $msbuildPath = & $vsWherePath -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe
          if ($msbuildPath) {
            Write-Host "`nMSBuild found at: $msbuildPath" -ForegroundColor Green
          } else {
            Write-Host "`nERROR: MSBuild not found!" -ForegroundColor Red
            exit 1
          }

      # Check repository structure
      - name: Check repository structure
        shell: powershell
        run: |
          Write-Host "=== Repository Structure Analysis ===" -ForegroundColor Green
          
          Write-Host "Current directory: $(Get-Location)"
          Write-Host ""
          
          # List current directory contents
          Write-Host "Current directory contents:"
          Get-ChildItem -Path "." -ErrorAction SilentlyContinue | ForEach-Object { 
            if ($_.psisContainer) {
              Write-Host "  [DIR]  $($_.Name)"
            } else {
              Write-Host "  [FILE] $($_.Name)"
            }
          }
          
          # Check for essential files
          if (Test-Path "CMakeLists.txt") {
            Write-Host "✓ Found CMakeLists.txt" -ForegroundColor Green
          } else {
            Write-Host "✗ CMakeLists.txt not found!" -ForegroundColor Red
            exit 1
          }
          
          if (Test-Path "src") {
            Write-Host "✓ Found src directory" -ForegroundColor Green
          } else {
            Write-Host "✗ src directory not found" -ForegroundColor Red
            exit 1
          }
          
          cmake --version
      
      # Generate CMake project
      - name: Generate CMake project (${{ matrix.config.type }})
        shell: powershell
        run: |
          Write-Host "=== CMake Configuration ===" -ForegroundColor Green

          # Determine build type
          $buildType = "${{ matrix.config.type }}"
          Write-Host "Build type: $buildType"

          # Clean previous build
          if (Test-Path "${{ env.BUILD_DIR }}") {
            Write-Host "Cleaning previous build directory..."
            Remove-Item -Recurse -Force "${{ env.BUILD_DIR }}" -ErrorAction SilentlyContinue
          }

          # Ensure build directory exists
          New-Item -ItemType Directory -Force -Path "${{ env.BUILD_DIR }}" | Out-Null

          # Configure with CMake using Visual Studio generator
          Write-Host "Running CMake configuration for $buildType..."
          Write-Host "CMake version: $(cmake --version | Select-Object -First 1)"
          Write-Host "Current directory: $(Get-Location)"

          # Run CMake configuration
          cmake -G "Visual Studio 17 2022" `
                -A x64 `
                -DCMAKE_BUILD_TYPE=$buildType `
                -DCMAKE_CXX_STANDARD=23 `
                -DCMAKE_CXX_FLAGS="/MP /W3 /EHsc" `
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
                -S . `
                -B "${{ env.BUILD_DIR }}"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "CMake configuration failed with exit code $LASTEXITCODE!" -ForegroundColor Red

            # Display CMake logs
            Write-Host "`n=== CMakeOutput.log ===" -ForegroundColor Yellow
            $outputLog = "${{ env.BUILD_DIR }}/CMakeFiles/CMakeOutput.log"
            if (Test-Path $outputLog) {
              Get-Content $outputLog | Select-Object -Last 50
            } else {
              Write-Host "CMakeOutput.log not found"
            }

            Write-Host "`n=== CMakeError.log ===" -ForegroundColor Yellow
            $errorLog = "${{ env.BUILD_DIR }}/CMakeFiles/CMakeError.log"
            if (Test-Path $errorLog) {
              Get-Content $errorLog
            } else {
              Write-Host "CMakeError.log not found"
            }

            exit 1
          }

          Write-Host "CMake configuration completed successfully" -ForegroundColor Green

          # Verify build directory was created
          if (!(Test-Path "${{ env.BUILD_DIR }}")) {
            Write-Host "ERROR: Build directory was not created!" -ForegroundColor Red
            exit 1
          }

          Write-Host "`nBuild directory contents:"
          Get-ChildItem -Path "${{ env.BUILD_DIR }}" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  - $($_.Name)" }
      
      # Build project
      - name: Build (${{ matrix.config.type }})
        shell: powershell
        run: |
          Write-Host "=== Building ${{ matrix.config.type }} ===" -ForegroundColor Green

          # Build with CMake
          Write-Host "Building with CMake..."
          cmake --build "${{ env.BUILD_DIR }}" `
                --config ${{ matrix.config.type }} `
                --parallel `
                --verbose

          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: Build failed with exit code $LASTEXITCODE" -ForegroundColor Red
            exit 1
          }

          # Verify build output
          Write-Host "Checking build output..."
          $builtFiles = Get-ChildItem -Path "${{ env.BUILD_DIR }}" -Recurse -Include "*.dll", "*.lib", "*.pdb"

          if ($builtFiles) {
            $builtFiles | ForEach-Object {
              Write-Host "Built: $($_.FullName) ($([math]::Round($_.Length/1KB, 2)) KB)" -ForegroundColor Green
            }
          } else {
            Write-Host "WARNING: No DLL/LIB/PDB files found in build directory" -ForegroundColor Yellow
          }
      
      # Create install directory
      - name: Create install directory
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "${{ env.INSTALL_DIR }}" | Out-Null
      
      # Install build artifacts
      - name: Install artifacts
        shell: powershell
        run: |
          cmake --install "${{ env.BUILD_DIR }}" `
            --config ${{ matrix.config.type }} `
            --prefix "${{ env.INSTALL_DIR }}"
      
      # Check build output
      - name: Verify build output
        shell: powershell
        run: |
          Write-Host "=== Verifying Build Output ===" -ForegroundColor Green
          
          # Find DLL files
          $dllFiles = Get-ChildItem -Path "${{ env.BUILD_DIR }}" -Recurse -Include "*.dll" -Filter "*YimMenuV2*"
          
          if ($dllFiles.Count -gt 0) {
            Write-Host "✓ DLL files found:" -ForegroundColor Green
            $dllFiles | ForEach-Object {
              $dllInfo = Get-Item $_
              Write-Host "  - $($_.FullName) ($([math]::Round($dllInfo.Length/1KB, 2)) KB)"
            }
          } else {
            Write-Host "✗ No YimMenuV2 DLL files found!" -ForegroundColor Red
            Write-Host "Searching for any DLL files in build directory:" -ForegroundColor Yellow
            Get-ChildItem -Path "${{ env.BUILD_DIR }}" -Recurse -Include "*.dll" | ForEach-Object {
              Write-Host "  - $($_.FullName)"
            }
            # Don't exit here - some builds might not produce DLLs
          }
      
      # Generate artifact names
      - name: Generate artifact name
        shell: powershell
        id: artifact
        run: |
          $date = Get-Date -Format 'yyyy-MM-dd'
          $commit_short = "${{ github.sha }}".Substring(0, 7)
          $artifact_name = "${{ matrix.config.type }}-build-$date-$commit_short"
          Write-Host "artifact_name=$artifact_name" >> $env:GITHUB_OUTPUT
      
      # Upload build artifacts
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: |
            ${{ env.BUILD_DIR }}/**/*.dll
            ${{ env.BUILD_DIR }}/**/*.lib
            ${{ env.BUILD_DIR }}/**/*.pdb
            ${{ env.INSTALL_DIR }}/**
          retention-days: 30
          compression-level: 6
          if-no-files-found: warn

      # Upload build logs on failure
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.config.type }}
          path: |
            ${{ env.BUILD_DIR }}/CMakeFiles/
            ${{ env.BUILD_DIR }}/CMakeOutput.log
            ${{ env.BUILD_DIR }}/CMakeError.log
            ${{ env.BUILD_DIR }}/**/*.log
          retention-days: 10
          if-no-files-found: ignore
      
      # Generate build summary
      - name: Generate build summary
        if: always()
        shell: powershell
        run: |
          Write-Host "## Windows Build Summary" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "**Configuration:** ${{ matrix.config.type }}" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "**Runner:** windows-2022" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "**Commit:** ${{ github.sha }}" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "**Build Directory:** ${{ env.BUILD_DIR }}" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "" >> $env:GITHUB_STEP_SUMMARY
          
          $dlls = Get-ChildItem -Path "${{ env.BUILD_DIR }}" -Recurse -Include "*.dll" -ErrorAction SilentlyContinue
          if ($dlls) {
            Write-Host "**Generated DLLs:**" >> $env:GITHUB_STEP_SUMMARY
            $dlls | ForEach-Object {
              Write-Host "- $($_.Name)" >> $env:GITHUB_STEP_SUMMARY
            }
          }

  build-status:
    name: Build Status Check
    runs-on: ubuntu-latest
    needs: [windows-build]
    if: always()
    
    steps:
      - name: Check build results
        run: |
          if [ "${{ needs.windows-build.result }}" = "success" ]; then
            echo "✓ All Windows builds completed successfully"
            exit 0
          else
            echo "✗ One or more builds failed"
            exit 1
          fi
